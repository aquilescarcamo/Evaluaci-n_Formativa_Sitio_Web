    <nav class="mb-4 text-center">

    <main class="container my-4 text-center">
        <h2>Lista de Personas (JSON)</h2>
        <ol id="lista" class="lista-datos"></ol>
    </main>
    <script>
        const lista = document.getElementById('lista');

        fetch('../json/datos.json')
            .then(response => response.json())
            .then(data => {
                data.forEach(persona => {
                    const li = document.createElement('li');
                    li.textContent = `Nombre: ${persona.nombre} - Edad: ${persona.edad} - Correo: ${persona.correo}`;
                    lista.appendChild(li);
                });
            })
            .catch(error => console.error('Error al cargar el archivo JSON:', error));
    </script>
    <footer class="text-center py-3 bg-dark text-white mt-4">
