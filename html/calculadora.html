<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <script src="../js/funciones.js"></script>
</head>
<body>

    <h1>Calculadora</h1>

    <form action="">
        <input type="number" id="num1" placeholder="Número 1">
        <input type="number" id="num2" placeholder="Número 2">
        <button type="button" onclick="sumaDosNumeros()">Sumar</button>
        <button type="button" onclick="restaDosNumeros()">Restar</button>
        <button type="button" onclick="multiplicacionDosNumeros()">Multiplicar</button>
        <button type="button" onclick="divisionDosNumeros()">Dividir</button>
        <p>Resultado: <span id="resultado"></span></p>
    </form>

</body>
</html>
