    <form name="myForm" action="" onsubmit="return validateForm()" method="post" enctype="multipart/form-data">
    <label for="nombre">Nombre:</label> <input type="text" id="nombre" name="fname">
    <br><br>
        <label for="apellido">Apellido:</label> <input type="text" id="apellido" name="apellido" required>
        <br><br>
        <label for="email">Correo electrónico:</label> <input type="email" id="email" name="email" required>
        <br><br>
        <label for="telefono">Teléfono:</label> <input type="text" id="telefono" name="telefono" required>
        <br><br>
        <label for="fecha_nac">Fecha de nacimiento:</label> <input type="date" id="fecha_nac" name="fecha_nac" required>
        <br><br>
        <label for="region">Región:</label>
        <select id="region" name="region" required>
            <option value="">Seleccione una región</option>
            <option value="arica">Región de Arica y Parinacota</option>
            <option value="tarapaca">Región de Tarapacá</option>
            <option value="antofagasta">Región de Antofagasta</option>
            <option value="atacama">Región de Atacama</option>
            <option value="coquimbo">Región de Coquimbo</option>
            <option value="valparaiso">Región de Valparaíso</option>
            <option value="metropolitana">Región Metropolitana de Santiago</option>
            <option value="ohiggins">Región del Libertador General Bernardo O'Higgins</option>
            <option value="maule">Región del Maule</option>
            <option value="nuble">Región de Ñuble</option>
            <option value="biobio">Región del Biobío</option>
            <option value="araucania">Región de La Araucanía</option>
            <option value="los_rios">Región de Los Ríos</option>
            <option value="los_lagos">Región de Los Lagos</option>
            <option value="aysen">Región de Aysén del General Carlos Ibáñez del Campo</option>
            <option value="magallanes">Región de Magallanes y de la Antártica Chilena</option>
        </select>
        <br><br>
        <label>Nivel educacional:</label><br>
        <input type="radio" id="media" name="educacion" value="media" required> <label for="media">Media</label>
        <input type="radio" id="tecnico" name="educacion" value="tecnico"> <label for="tecnico">Técnico</label>
        <input type="radio" id="universitario" name="educacion" value="universitario"> <label for="universitario">Universitario</label>
        <input type="radio" id="otro" name="educacion" value="otro"> <label for="otro">Otro</label>
        <br><br>
        <label>Intereses:</label><br>
        <input type="checkbox" id="tech" name="interes" value="tech"> <label for="tech">Tecnología</label>
        <input type="checkbox" id="salud" name="interes" value="salud"> <label for="salud">Salud</label>
        <input type="checkbox" id="educación" name="interes" value="educación"> <label for="educación">educación</label>
        <input type="checkbox" id="administración" name="interes" value="administración"> <label for="administración">Administración</label>
        <input type="checkbox" id="diseño" name="interes" value="diseño"> <label for="diseño">Diseño</label>
        <input type="checkbox" id="Otras" name="interes" value="Otras"> <label for="Otras">Otras</label>
        <br><br>
        <label for="mensaje">Mensaje u Observaciones:</label><br>
        <textarea id="mensaje" name="mensaje" required></textarea>
        <br><br>
        <label for="curriculum">Currículum:</label> <input type="file" id="curriculum" name="curriculum">
        <br><br>
        <button type="submit">Enviar</button>
        <button type="reset">Limpiar</button>
    </form>
