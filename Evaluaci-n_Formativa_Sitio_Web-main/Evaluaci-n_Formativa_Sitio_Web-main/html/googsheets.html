<html lang="es">
<head>
    <meta charset="UTF-8">

    <link rel="icon" type="image/x-icon" href="../img/logo1.jpg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <header class="text-center my-3">
        <a href="../index.html">
            <img src="../img/imagenlogo.png" class="img-fluid" style="max-width: 100%; height: auto; max-height: 300px; object-fit: cover;" alt="Logo" width="600" height="230">
        </a>
        <h1 class="mt-2">Bienvenido a mi Sitio Web</h1>
    </header>
    <nav class="mb-4 text-center">
    <ul class="list-inline">
        <li class="list-inline-item"><a href="../index.html">Inicio</a></li>
        <li class="list-inline-item"><a href="acercade.html">Acerca de</a></li>
        <li class="list-inline-item"><a href="servicios.html">Servicios</a></li>
        <li class="list-inline-item"><a href="contacto.html">Contacto</a></li>
        <li class="list-inline-item"><a href="calculadora.html">Calculadora</a></li>
        <li class="list-inline-item"><a href="ejemplodejavascript.html">Ejemplos de JS</a></li>

        <li class="list-inline-item"><a href="localstorage.html">LocalStorage</a></li>
        <li class="list-inline-item"><a href="googsheets.html">Google Sheets</a></li>
    </ul>
    </nav>
    <main class="container my-4 text-center">
        <h2>Personas</h2>
        <table class="table table-striped table-bordered w-auto mx-auto">
            <thead>
                <tr><th>Nombre</th><th>Edad</th><th>Correo</th></tr>
            </thead>
            <tbody id="tabla"></tbody>
        </table>
        <p id="mensaje" class="text-danger"></p>
    </main>
    <script>
        const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSUGj0uA_3ykHx9JatY8LkRVNMluNN_4fnyU82Y0qsGYz8PAPEF0YB6LAmeP085LqY0PHKWzXQstOmb/pub?gid=1852630960&single=true&output=csv';
        fetch(URL_CSV)
            .then(res => res.text())
            .then(texto => {
                const tabla = document.getElementById('tabla');
                texto.trim().split('\n').slice(1).forEach(linea => {
                    const [nombre, edad, correo] = linea.trim().split(',');
                    const fila = tabla.insertRow();
                    fila.insertCell().textContent = nombre;
                    fila.insertCell().textContent = edad;
                    fila.insertCell().textContent = correo;
                });
            })
            .catch(() => {
                document.getElementById('mensaje').textContent = 'No se pudo cargar la hoja de Google Sheets.';
            });
    </script>
    <footer class="text-center py-3 bg-dark text-white mt-4">
        <p class="mb-0">Derechos Reservados &copy; 2026 AQUILES CARCAMO</p>
    </footer>
</body>
</html>
